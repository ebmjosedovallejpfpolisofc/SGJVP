<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Portal Monitor/Professor
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:
linear-gradient(
135deg,
#0f172a,
#1e293b
);
min-height:100vh;
padding:20px;
color:white;
}

.container{
max-width:1200px;
margin:auto;
}

.card{
background:
rgba(255,255,255,.08);
backdrop-filter:
blur(10px);
padding:20px;
border-radius:25px;
margin-bottom:20px;
}

.topo{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
flex-wrap:wrap;
}

.grid{
display:grid;
grid-template-columns:
repeat(
auto-fit,
minmax(220px,1fr)
);
gap:15px;
margin-top:20px;
}

button{
border:none;
padding:15px;
border-radius:18px;
background:#38bdf8;
color:white;
font-size:16px;
cursor:pointer;
transition:.2s;
}

button:hover{
transform:scale(1.02);
}

.btn-red{
background:#ef4444;
}

.btn-green{
background:#22c55e;
}

.item{
background:
rgba(255,255,255,.06);
padding:15px;
border-radius:18px;
margin-top:10px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th,
td{
border:
1px solid
rgba(255,255,255,.2);
padding:12px;
text-align:center;
}

input,
select,
textarea{
width:100%;
padding:12px;
border:none;
border-radius:12px;
margin-top:8px;
background:#334155;
color:white;
}

.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
rgba(0,0,0,.85);
display:none;
justify-content:center;
align-items:center;
z-index:9999;
}

.popup-box{
width:450px;
max-width:95%;
background:#1e293b;
padding:25px;
border-radius:25px;
max-height:90vh;
overflow:auto;
}

.popup-box h2{
text-align:center;
margin-bottom:15px;
}

.grupo-btn{
width:100%;
margin-top:10px;
}

.chat{
height:300px;
overflow:auto;
background:
rgba(255,255,255,.05);
padding:10px;
border-radius:15px;
margin-bottom:10px;
}

.msg{
padding:10px;
border-radius:12px;
margin-top:8px;
background:
rgba(255,255,255,.08);
}

</style>

</head>
<body>

<div class="container">

<div class="card">

<div class="topo">

<div>

<h1 id="ola">
Portal
</h1>

<p id="cargo">
---
</p>

</div>

<button
class="btn-red"
onclick="logout()">

Sair

</button>

</div>

</div>

<div class="card">

<div class="grid">

<button onclick="abrirGrupo('verTurma')">
👥 Ver Turma
</button>

<button onclick="abrirGrupo('avaliar')">
📝 Avaliar
</button>

<button onclick="abrirGrupo('chamada')">
📋 Chamada
</button>

<button onclick="abrirGrupo('pedidos')">
📦 Pedidos
</button>

<button onclick="abrirGrupo('atividades')">
📚 Visualizar Atividades
</button>

<button onclick="abrirGrupo('editarTurma')">
✏ Editar Turma
</button>

<button onclick="abrirGrupo('chat')">
💬 Chat
</button>

</div>

</div>

<div
class="card"
id="conteudo">

Selecione uma opção.

</div>

</div>

<div
id="popupGrupo"
class="popup">

<div class="popup-box">

<h2>
Escolha O Grupo
Para Completar A Ação
</h2>

<div id="listaGrupos"></div>

<button
class="btn-red grupo-btn"
onclick="fecharGrupo()">

Fechar

</button>

</div>

</div>

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
collection,
getDocs,
doc,
getDoc,
setDoc,
addDoc,
deleteDoc,
query,
where

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey:
"AIzaSyAyXEqSP0WG5CPw7ZrMQ6v5WUb_OPi_UoI",

authDomain:
"spjvp-49fde.firebaseapp.com",

projectId:
"spjvp-49fde",

storageBucket:
"spjvp-49fde.firebasestorage.app",

messagingSenderId:
"790148342609",

appId:
"1:790148342609:web:18a3a59a4d52ba50572970"

};

const app =
initializeApp(
firebaseConfig
);

const db =
getFirestore(
app
);

const usuario =

JSON.parse(
localStorage.getItem(
"usuario"
)
);

if(
!usuario
||
usuario.tipo
!== "admin"
){

location.href =
"index.html";

}

document
.getElementById(
"ola"
)
.innerText =

`Olá, ${usuario.nome}`;

document
.getElementById(
"cargo"
)
.innerText =

usuario.cargo;

const conteudo =
document.getElementById(
"conteudo"
);

let acaoAtual =
"";

const grupos = [

"41 A",
"41 B",
"41 C",

"50 A",
"50 B",
"50 C",

"51 A",
"51 B",
"51 C",

"52 A",
"52 B",
"52 C"

];

window.logout =
function(){

localStorage.removeItem(
"usuario"
);

location.href =
"index.html";

}

window.abrirGrupo =
function(acao){

acaoAtual =
acao;

document
.getElementById(
"popupGrupo"
)
.style.display =
"flex";

let html = "";

grupos.forEach(g=>{

html += `

<button
class="grupo-btn"
onclick="selecionarGrupo('${g}')">

Turma ${g}

</button>

`;

});

document
.getElementById(
"listaGrupos"
)
.innerHTML =
html;

}

window.fecharGrupo =
function(){

document
.getElementById(
"popupGrupo"
)
.style.display =
"none";

}

function gerarCargo(grupo){

const partes =
grupo.split(" ");

const turma =
partes[0];

const letra =
partes[1];

const periodo =

turma === "52"

?

"matutino"

:

"vespertino";

return
`Marcenaria: ${periodo} t${turma} G: ${letra}`;

}

window.selecionarGrupo =
async function(grupo){

fecharGrupo();

const cargo =
gerarCargo(grupo);

if(
acaoAtual
=== "verTurma"
){

const q =
query(
collection(db,"alunos"),
where(
"cargo",
"==",
cargo
)
);

const snap =
await getDocs(q);

let html =
`<h2>
Turma ${grupo}
</h2>`;

snap.forEach(docx=>{

const d =
docx.data();

html += `

<div class="item">

${d.nome}

<button
style="
margin-top:10px;
width:100%;
"
onclick="
abrirChatAluno(
'${docx.id}',
'${d.nome}'
)
">

💬 Chat
</button>

</div>

`;

});

conteudo.innerHTML =
html;

}

if(
acaoAtual
=== "avaliar"
){

const q =
query(
collection(db,"alunos"),
where(
"cargo",
"==",
cargo
)
);

const snap =
await getDocs(q);

let html = `

<h2>
Avaliar
Turma ${grupo}
</h2>

<table>

<tr>

<th>
Aluno
</th>

<th>
Obediência
(0/10)
</th>

<th>
Participação
(0/10)
</th>

</tr>

`;

snap.forEach(docx=>{

const d =
docx.data();

html += `

<tr>

<td>
${d.nome}
</td>

<td>

<input
type="number"
min="0"
max="10"
id="ob_${docx.id}">

</td>

<td>

<input
type="number"
min="0"
max="10"
id="pa_${docx.id}">

</td>

</tr>

`;

});

html += `

</table>

<button
onclick="
salvarAvaliacao(
'${cargo}'
)
">

Salvar Avaliação

</button>

`;

conteudo.innerHTML =
html;

}

if(
acaoAtual
=== "chamada"
){

const q =
query(
collection(db,"alunos"),
where(
"cargo",
"==",
cargo
)
);

const snap =
await getDocs(q);

let html = `

<h2>
Chamada
${grupo}
</h2>

<table>

<tr>

<th>
Nome
</th>

<th>
Opção
</th>

<th>
Justificativa
</th>

</tr>

`;

snap.forEach(docx=>{

const d =
docx.data();

html += `

<tr>

<td>
${d.nome}
</td>

<td>

<select
id="ch_${docx.id}"
onchange="
toggleJust(
'${docx.id}'
)
">

<option value="">
Escolha
</option>

<option value="P">
Presença
</option>

<option value="F">
Falta Injustificada
</option>

<option value="FJ">
Falta Justificada
</option>

<option value="D">
Dispensado
</option>

</select>

</td>

<td>

<input
class="hidden"
id="j_${docx.id}"
placeholder="
Justifique
a falta">

</td>

</tr>

`;

});

html += `

</table>

<button
onclick="
salvarChamada(
'${cargo}'
)
">

Salvar Chamada

</button>

`;

conteudo.innerHTML =
html;

}

if(
acaoAtual
=== "pedidos"
){

const q =
query(
collection(db,"alunos"),
where(
"cargo",
"==",
cargo
)
);

const snap =
await getDocs(q);

let html =
`<h2>
Pedidos
${grupo}
</h2>`;

snap.forEach(docx=>{

const d =
docx.data();

(
d.pedidos
||
[]
)
.forEach(p=>{

html += `

<div class="item">

<b>
${d.nome}
</b>

<br>

${p.texto}

<br><br>

<small>
${p.data}
</small>

</div>

`;

});

});

conteudo.innerHTML =
html;

}

if(
acaoAtual
=== "editarTurma"
){

const q =
query(
collection(db,"alunos"),
where(
"cargo",
"==",
cargo
)
);

const snap =
await getDocs(q);

let html = `

<h2>
Editar Turma
${grupo}
</h2>

<h3>
Adicionar Aluno
</h3>

<input
id="novoNome"
placeholder="Nome">

<input
id="novoMotivo"
placeholder="Motivo">

<input
id="novoFoto"
placeholder="Foto URL">

<button
onclick="
adicionarAluno(
'${cargo}'
)
">

Adicionar

</button>

<hr><br>

<h3>
Excluir Aluno
</h3>

`;

snap.forEach(docx=>{

const d =
docx.data();

html += `

<div class="item">

${d.nome}

<button
class="btn-red"
style="
margin-top:10px;
width:100%;
"
onclick="
excluirAluno(
'${docx.id}'
)
">

Excluir

</button>

</div>

`;

});

conteudo.innerHTML =
html;

}

if(
acaoAtual
=== "atividades"
){

const ref =
doc(
db,
"atividades",
cargo
);

const snap =
await getDoc(
ref
);

let html =
`<h2>
Atividades
${grupo}
</h2>`;

if(
snap.exists()
){

(
snap.data()
.atividades
||
[]
)
.forEach(a=>{

html += `

<div
class="item"
onclick="
verEntregas(
'${cargo}',
'${a.nome}'
)
">

📚
${a.nome}

</div>

`;

});

}

conteudo.innerHTML =
html;

}

}

window.toggleJust =
function(id){

const valor =

document
.getElementById(
"ch_" + id
)
.value;

const campo =

document
.getElementById(
"j_" + id
);

if(
valor
===
"FJ"
){

campo
.classList
.remove(
"hidden"
);

}
else{

campo
.classList
.add(
"hidden"
);

}

}

window.salvarAvaliacao =
async function(cargo){

const q =
query(
collection(db,"alunos"),
where(
"cargo",
"==",
cargo
)
);

const snap =
await getDocs(q);

let notas = [];

snap.forEach(docx=>{

const ob =

document
.getElementById(
"ob_" +
docx.id
)
.value;

const pa =

document
.getElementById(
"pa_" +
docx.id
)
.value;

notas.push({

id:
docx.id,

nome:
docx.data().nome,

obediencia:
ob || "0",

participacao:
pa || "0"

});

});

await setDoc(

doc(
db,
"avaliacoes",
cargo
),

{

cargo,
notas,
data:
new Date()
.toLocaleString()

}

);

alert(
"Avaliação salva!"
);

}

window.salvarChamada =
async function(cargo){

const q =
query(
collection(db,"alunos"),
where(
"cargo",
"==",
cargo
)
);

const snap =
await getDocs(q);

let chamada =
[];

let erro =
false;

snap.forEach(docx=>{

const status =

document
.getElementById(
"ch_" +
docx.id
)
.value;

const justificativa =

document
.getElementById(
"j_" +
docx.id
)
.value
.trim();

if(
!status
){

erro = true;

return;

}

if(
status
===
"FJ"
&&
!justificativa
){

alert(
`${docx.data().nome}
precisa de justificativa`
);

erro = true;

return;

}

chamada.push({

id:
docx.id,

nome:
docx.data().nome,

status,

justificativa:

status ===
"FJ"

?

justificativa

:

""

});

});

if(
erro
){

alert(
"Verifique todos os alunos."
);

return;

}

await addDoc(

collection(
db,
"chamadas"
),

{

cargo,
chamada,

professor:
usuario.nome,

data:
new Date()
.toLocaleString()

}

);

alert(
"Chamada salva!"
);

}

window.adicionarAluno =
async function(cargo){

const nome =

document
.getElementById(
"novoNome"
)
.value
.trim();

const motivo =

document
.getElementById(
"novoMotivo"
)
.value
.trim();

const foto =

document
.getElementById(
"novoFoto"
)
.value
.trim();

if(
!nome
){

alert(
"Digite o nome"
);

return;

}

const partes =
nome.split(" ");

const id =

Math.floor(
Math.random()
*90
+10
)

+

partes[0][0]
.toUpperCase()

+

partes[
partes.length-1
][0]
.toUpperCase()

+

Math.floor(
Math.random()
*9000
+1000
);

await setDoc(

doc(
db,
"alunos",
id
),

{

nome,
cargo,
motivo:
motivo
||
"Aula normal",

foto:
foto
||
""

}

);

alert(
`Aluno criado!
ID: ${id}`
);

}

window.excluirAluno =
async function(id){

const confirmar =
confirm(
"Excluir aluno?"
);

if(
!confirmar
)return;

await deleteDoc(

doc(
db,
"alunos",
id
)

);

alert(
"Aluno removido"
);

}

window.abrirChatAluno =
async function(
id,
nome
){

conteudo.innerHTML = `

<h2>
Chat com
${nome}
</h2>

<div
class="chat"
id="chatBox">

Carregando...

</div>

<textarea
id="msg"
placeholder="
Digite a mensagem
"></textarea>

<button
onclick="
enviarMensagem(
'${id}'
)
">

Enviar

</button>

`;

const ref =
doc(
db,
"chats",
id
);

const snap =
await getDoc(
ref
);

let html =
"";

if(
snap.exists()
){

(
snap.data()
.mensagens
||
[]
)
.forEach(m=>{

html += `

<div class="msg">

<b>
${m.autor}
</b>

<br>

${m.texto}

</div>

`;

});

}

document
.getElementById(
"chatBox"
)
.innerHTML =
html
||
"Sem mensagens";

}

window.enviarMensagem =
async function(id){

const texto =

document
.getElementById(
"msg"
)
.value
.trim();

if(
!texto
)return;

const ref =
doc(
db,
"chats",
id
);

const snap =
await getDoc(
ref
);

let mensagens =
[];

if(
snap.exists()
){

mensagens =
snap.data()
.mensagens
||
[];

}

mensagens.push({

autor:
usuario.nome,

texto,

data:
Date.now()

});

await setDoc(
ref,
{
mensagens
}
);

alert(
"Mensagem enviada"
);

}

window.verEntregas =
async function(
cargo,
atividade
){

const snap =
await getDocs(
collection(
db,
"entregas"
)
);

let html = `

<h2>

${atividade}

</h2>

`;

snap.forEach(docx=>{

const d =
docx.data();

if(

d.cargo
===
cargo

&&

d.atividade
===
atividade

){

html += `

<div class="item">

<b>
${d.nome}
</b>

<br>

ID:
${d.id}

<br>

Entregue

</div>

`;

}

});

conteudo.innerHTML =
html
||
"Sem entregas";

}

</script>

</body>
</html>
