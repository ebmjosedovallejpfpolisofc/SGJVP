<!DOCTYPE html>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:
linear-gradient(
135deg,
#0f172a,
#1e293b
);
min-height:100vh;
padding:20px;
color:white;
}

.container{
max-width:500px;
margin:auto;
}

.card{
background:
rgba(255,255,255,.08);
backdrop-filter:
blur(10px);
padding:25px;
border-radius:25px;
}

.title{
text-align:center;
margin-bottom:20px;
}

.title h1{
font-size:32px;
}

.title p{
opacity:.8;
margin-top:5px;
}

.btn{
width:100%;
padding:15px;
border:none;
border-radius:18px;
background:#38bdf8;
color:white;
font-size:16px;
cursor:pointer;
margin-top:12px;
transition:.2s;
}

.btn:hover{
transform:scale(1.02);
}

.btn-red{
background:#ef4444;
}

.hidden{
display:none;
}

#reader{
display:none;
overflow:hidden;
border-radius:25px;
margin-top:15px;
}

.status{
margin-top:15px;
font-size:18px;
text-align:center;
font-weight:bold;
}

.ok{
color:#4ade80;
}

.erro{
color:#ef4444;
}

.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
rgba(0,0,0,.85);
display:none;
justify-content:center;
align-items:center;
z-index:9999;
}

.popup-box{
width:380px;
max-width:95%;
background:#1e293b;
padding:25px;
border-radius:25px;
}

.popup-box h2{
text-align:center;
margin-bottom:15px;
}

input,
select{
width:100%;
padding:14px;
border:none;
border-radius:15px;
background:#334155;
color:white;
margin-top:10px;
}

.monitor{
display:flex;
align-items:center;
gap:10px;
padding:12px;
border-radius:15px;
margin-top:10px;
background:
rgba(255,255,255,.06);
}

.monitor img{
width:60px;
height:60px;
border-radius:50%;
object-fit:cover;
}

</style>

</head>

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
doc,
getDoc

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey:
"AIzaSyAyXEqSP0WG5CPw7ZrMQ6v5WUb_OPi_UoI",

authDomain:
"spjvp-49fde.firebaseapp.com",

projectId:
"spjvp-49fde",

storageBucket:
"spjvp-49fde.firebasestorage.app",

messagingSenderId:
"790148342609",

appId:
"1:790148342609:web:18a3a59a4d52ba50572970"

};

const app =
initializeApp(
firebaseConfig
);

const db =
getFirestore(
app
);

let deferredPrompt =
null;

window.addEventListener(
"beforeinstallprompt",
(e)=>{

e.preventDefault();

deferredPrompt =
e;

}
);

window.instalarApp =
async function(){

if(
deferredPrompt
){

deferredPrompt.prompt();

await deferredPrompt
.userChoice;

}
else{

alert(
"Instalação indisponível agora."
);

}

}

window.abrirLogin =
function(){

document
.getElementById(
"popupLogin"
)
.style.display =
"flex";

}

window.fecharLogin =
function(){

document
.getElementById(
"popupLogin"
)
.style.display =
"none";

}

window.verEquipe =
function(){

document
.getElementById(
"popupEquipe"
)
.style.display =
"flex";

}

window.fecharEquipe =
function(){

document
.getElementById(
"popupEquipe"
)
.style.display =
"none";

}

const isStandalone =

window.matchMedia(
"(display-mode: standalone)"
).matches

||

window.navigator.standalone

||

document.referrer.includes(
"android-app://"
);

if(
isStandalone
){

document
.getElementById(
"blockSite"
)
.style.display =
"none";

document
.getElementById(
"appContent"
)
.classList.remove(
"hidden"
);

document
.getElementById(
"reader"
)
.style.display =
"block";

setTimeout(()=>{

iniciarScanner();

},500);

}

let scanner =
null;

let cameras =
[];

let currentCamera =
0;

async function iniciarScanner(){

try{

scanner =
new Html5Qrcode(
"reader"
);

cameras =
await Html5Qrcode
.getCameras();

if(
!cameras.length
){

document
.getElementById(
"status"
)
.innerHTML =

"❌ Nenhuma câmera encontrada";

return;

}

await iniciarCamera(
cameras[0].id
);

}catch(err){

console.error(
err
);

document
.getElementById(
"status"
)
.innerHTML =

"❌ Erro ao iniciar câmera";

}

}

window.trocarCamera =
async function(){

if(
cameras.length
<= 1
)return;

currentCamera =

(
currentCamera
+ 1
)

%
cameras.length;

try{

await scanner.stop();

await iniciarCamera(

cameras[
currentCamera
].id

);

}catch(err){

console.error(
err
);

}

}

async function iniciarCamera(
cameraId
){

await scanner.start(

cameraId,

{

fps:10,

qrbox:{
width:250,
height:250
}

},

(decodedText)=>{

procurarPessoa(
decodedText.trim()
);

},

()=>{}

);

}

async function procurarPessoa(
codigo
){

try{

const ref =
doc(
db,
"alunos",
codigo
);

const snap =
await getDoc(
ref
);

if(
!snap.exists()
){

document
.getElementById(
"status"
)
.innerHTML =

"❌ ID não encontrado";

document
.getElementById(
"status"
)
.className =
"status erro";

return;

}

const data =
snap.data();

const cargoLower =

(
data.cargo
||
""
)
.toLowerCase();

const ehAdmin =

cargoLower.includes(
"monitor"
)

||

cargoLower.includes(
"professor"
);

salvarUsuario(
data,
codigo,
ehAdmin
?
"admin"
:
"aluno"
);

document
.getElementById(
"status"
)
.innerHTML =

"✅ Confirmado";

document
.getElementById(
"status"
)
.className =
"status ok";

setTimeout(()=>{

location.href =

ehAdmin

?

"portal-monitor-prof.html"

:

"portal-aluno.html";

},1000);

}catch(err){

console.error(
err
);

}

}

window.fazerLogin =
async function(){

const id =

document
.getElementById(
"loginId"
)
.value
.trim();

const cargo =

document
.getElementById(
"loginCargo"
)
.value;

if(
!id
||
!cargo
){

alert(
"Preencha tudo."
);

return;

}

try{

const ref =
doc(
db,
"alunos",
id
);

const snap =
await getDoc(
ref
);

if(
!snap.exists()
){

alert(
"ID não encontrado"
);

return;

}

const data =
snap.data();

if(
data.cargo
!== cargo
){

alert(
"Cargo incorreto"
);

return;

}

const cargoLower =
cargo.toLowerCase();

const ehAdmin =

cargoLower.includes(
"monitor"
)

||

cargoLower.includes(
"professor"
);

salvarUsuario(
data,
id,
ehAdmin
?
"admin"
:
"aluno"
);

location.href =

ehAdmin

?

"portal-monitor-prof.html"

:

"portal-aluno.html";

}catch(err){

console.error(
err
);

alert(
"Erro no login"
);

}

}

function salvarUsuario(
data,
id,
tipo
){

localStorage.setItem(

"usuario",

JSON.stringify({

id,

nome:
data.nome,

cargo:
data.cargo,

foto:
data.foto
||
"",

tipo

})

);

}

if(
"serviceWorker"
in navigator
){

window.addEventListener(
"load",
()=>{

navigator
.serviceWorker
.register(
"./service-worker.js"
)

.then(()=>{

console.log(
"Service Worker registrado"
);

})

.catch(err=>{

console.error(
"Erro SW:",
err
);

});

});

}

</script>

</body>
</html>
