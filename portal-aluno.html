<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Portal Aluno
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:
linear-gradient(
135deg,
#0f172a,
#1e293b
);
min-height:100vh;
padding:20px;
color:white;
}

.container{
max-width:1000px;
margin:auto;
}

.card{
background:
rgba(255,255,255,.08);
backdrop-filter:
blur(10px);
padding:20px;
border-radius:25px;
margin-bottom:20px;
}

.topo{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
flex-wrap:wrap;
}

.grid{
display:grid;
grid-template-columns:
repeat(
auto-fit,
minmax(220px,1fr)
);
gap:15px;
margin-top:20px;
}

button{
border:none;
padding:15px;
border-radius:18px;
background:#38bdf8;
color:white;
font-size:16px;
cursor:pointer;
transition:.2s;
}

button:hover{
transform:scale(1.02);
}

.btn-red{
background:#ef4444;
}

.btn-green{
background:#22c55e;
}

.item{
background:
rgba(255,255,255,.06);
padding:15px;
border-radius:18px;
margin-top:10px;
}

.chat{
height:300px;
overflow:auto;
background:
rgba(255,255,255,.05);
padding:10px;
border-radius:15px;
margin-bottom:10px;
}

.msg{
padding:10px;
border-radius:12px;
margin-top:8px;
background:
rgba(255,255,255,.08);
}

.erro{
color:#ef4444;
font-weight:bold;
margin-bottom:10px;
}

.ok{
color:#4ade80;
font-weight:bold;
margin-bottom:10px;
}

</style>

</head>
<body>

<div class="container">

<div class="card">

<div class="topo">

<div>

<h1 id="ola">
Portal Aluno
</h1>

<p id="cargo">
---
</p>

</div>

<button
class="btn-red"
onclick="logout()">

Sair

</button>

</div>

</div>

<div class="card">

<div class="grid">

<button onclick="mostrarAtividades()">
📚 Atividades
</button>

<button onclick="mostrarPedidos()">
📦 Pedidos
</button>

<button onclick="mostrarNotas()">
📝 Minhas Notas
</button>

<button onclick="mostrarChamada()">
📋 Minha Chamada
</button>

<button onclick="abrirChat()">
💬 Chat com Prof
</button>

</div>

</div>

<div
class="card"
id="conteudo">

Selecione uma opção.

</div>

</div>

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
doc,
getDoc,
setDoc,
collection,
getDocs

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey:
"AIzaSyAyXEqSP0WG5CPw7ZrMQ6v5WUb_OPi_UoI",

authDomain:
"spjvp-49fde.firebaseapp.com",

projectId:
"spjvp-49fde",

storageBucket:
"spjvp-49fde.firebasestorage.app",

messagingSenderId:
"790148342609",

appId:
"1:790148342609:web:18a3a59a4d52ba50572970"

};

const app =
initializeApp(
firebaseConfig
);

const db =
getFirestore(
app
);

const usuario =

JSON.parse(
localStorage.getItem(
"usuario"
)
);

if(
!usuario
||
usuario.tipo
!== "aluno"
){

location.href =
"index.html";

}

document
.getElementById(
"ola"
)
.innerText =

`Olá, ${usuario.nome}`;

document
.getElementById(
"cargo"
)
.innerText =

usuario.cargo;

const conteudo =
document.getElementById(
"conteudo"
);

window.logout =
function(){

localStorage.removeItem(
"usuario"
);

location.href =
"index.html";

}

window.mostrarAtividades =
async function(){

const ref =
doc(
db,
"atividades",
usuario.cargo
);

const snap =
await getDoc(
ref
);

let html =
`<h2>
Atividades
</h2>`;

if(
!snap.exists()
){

conteudo.innerHTML =
"Sem atividades.";

return;

}

const atividades =

snap.data()
.atividades
||
[];

atividades.forEach(a=>{

const hoje =
new Date();

const entrega =
new Date(
a.entrega
);

const enviadoKey =

`atividade_${usuario.id}_${a.nome}`;

const enviada =

localStorage.getItem(
enviadoKey
);

html += `

<div class="item">

<h3>
${a.nome}
</h3>

<p>
Envio:
${a.envio}
</p>

<p>
Entrega:
${a.entrega}
</p>

`;

if(
hoje > entrega
&&
!enviada
){

html += `

<p class="erro">

DATA FINAL
DE ENTREGA
JÁ
ULTRAPASSADA!

</p>

`;

}
else if(
!enviada
){

html += `

<p class="ok">

ENTREGA
EM ABERTO!
ENVIE ABAIXO

</p>

<button
onclick="
enviarAtividade(
'${a.nome}'
)
">

Enviar
Atividade

</button>

`;

}
else{

html += `

<button
disabled
style="
background:#22c55e;
cursor:not-allowed;
width:100%;
">

ATIVIDADE
ENVIADA

(se não enviou
converse com
monitor
ou professora)

</button>

`;

}

html += `</div>`;

});

conteudo.innerHTML =
html;

}

window.enviarAtividade =
async function(
atividade
){

const assunto =

encodeURIComponent(
"Entrega de Atividade"
);

const mensagem =

encodeURIComponent(

`Atividade:
${atividade}

Do aluno:
${usuario.nome}
(ID:
${usuario.id})`

);

window.location.href =

`mailto:
salete.santos@prof.pmf.sc.gov.br

?subject=
${assunto}

&body=
${mensagem}`;

localStorage.setItem(

`atividade_${usuario.id}_${atividade}`,

"true"

);

await setDoc(

doc(
db,
"entregas",
`${usuario.id}_${atividade}`
),

{

id:
usuario.id,

nome:
usuario.nome,

cargo:
usuario.cargo,

atividade,

data:
new Date()
.toLocaleString()

}

);

mostrarAtividades();

}

window.mostrarPedidos =
function(){

conteudo.innerHTML = `

<h2>
Fazer Pedido
</h2>

<textarea
id="pedido"
placeholder="
Digite
seu pedido
"></textarea>

<button
onclick="
enviarPedido()
">

Enviar Pedido

</button>

`;

}

window.enviarPedido =
async function(){

const texto =

document
.getElementById(
"pedido"
)
.value
.trim();

if(
!texto
){

alert(
"Digite algo."
);

return;

}

const ref =
doc(
db,
"alunos",
usuario.id
);

const snap =
await getDoc(
ref
);

let pedidos =
[];

if(
snap.exists()
){

pedidos =
snap.data()
.pedidos
||
[];

}

pedidos.push({

texto,

data:
new Date()
.toLocaleString()

});

await setDoc(
ref,
{
...snap.data(),
pedidos
}
);

alert(
"Pedido enviado!"
);

}

window.mostrarNotas =
async function(){

const ref =
doc(
db,
"avaliacoes",
usuario.cargo
);

const snap =
await getDoc(
ref
);

if(
!snap.exists()
){

conteudo.innerHTML =
"Sem notas.";

return;

}

const notas =

snap.data()
.notas
||
[];

const minha =

notas.find(

n=>

n.id
===
usuario.id

);

if(
!minha
){

conteudo.innerHTML =
"Sem avaliação.";

return;

}

conteudo.innerHTML = `

<h2>
Minhas Notas
</h2>

<div class="item">

<b>
Obediência:
</b>

${minha.obediencia}

</div>

<div class="item">

<b>
Participação:
</b>

${minha.participacao}

</div>

`;

}

window.mostrarChamada =
async function(){

const snap =
await getDocs(
collection(
db,
"chamadas"
)
);

let html =
"<h2>Minha Chamada</h2>";

snap.forEach(docx=>{

const d =
docx.data();

(
d.chamada
||
[]
)
.forEach(c=>{

if(
c.id
===
usuario.id
){

html += `

<div class="item">

<b>
Data:
</b>

${d.data}

<br>

<b>
Status:
</b>

${c.status}

${
c.justificativa
?
`<br>
<b>
Justificativa:
</b>
${c.justificativa}`
:
""
}

</div>

`;

}

});

});

conteudo.innerHTML =
html;

}

window.abrirChat =
async function(){

const ref =
doc(
db,
"chats",
usuario.id
);

const snap =
await getDoc(
ref
);

let mensagens =
[];

if(
snap.exists()
){

mensagens =
snap.data()
.mensagens
||
[];

}

const profJaMandou =

mensagens.some(

m=>

m.autor
!== usuario.nome

);

let html = `

<h2>
Chat com Prof
</h2>

<div
class="chat"
id="chatBox">

`;

mensagens.forEach(m=>{

html += `

<div class="msg">

<b>
${m.autor}
</b>

<br>

${m.texto}

</div>

`;

});

html += `</div>`;

if(
profJaMandou
){

html += `

<textarea
id="msg"
placeholder="
Digite
sua mensagem
"></textarea>

<button
onclick="
responderChat()
">

Enviar

</button>

`;

}
else{

html += `

<p class="erro">

Você não pode
mandar mensagem
antes do professor.

</p>

`;

}

conteudo.innerHTML =
html;

}

window.responderChat =
async function(){

const texto =

document
.getElementById(
"msg"
)
.value
.trim();

if(
!texto
)return;

const ref =
doc(
db,
"chats",
usuario.id
);

const snap =
await getDoc(
ref
);

let mensagens =
[];

if(
snap.exists()
){

mensagens =
snap.data()
.mensagens
||
[];

}

mensagens.push({

autor:
usuario.nome,

texto,

data:
Date.now()

});

await setDoc(
ref,
{
mensagens
}
);

abrirChat();

}

</script>

</body>
</html>
